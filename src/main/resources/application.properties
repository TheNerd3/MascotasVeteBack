spring.application.name=backendVeterinarias

# ---------------------------------------------------------
# Conexion a la base de datos MascotasCordoba (SQL Server)
# Todas las credenciales se toman de variables de entorno,
# nunca se hardcodean en el repo.
#
# Variables esperadas:
#   DB_HOST      -> host del SQL Server (default: localhost)
#   DB_PORT      -> puerto del SQL Server (default: 1433)
#   DB_NAME      -> nombre de la base (default: MascotasCordoba)
#   DB_USER      -> usuario de SQL Server
#   DB_PASSWORD  -> contrasenia de SQL Server
# ---------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};\
  databaseName=${DB_NAME:MascotasCordoba};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# El esquema ya existe (creado por el script SQL) y se administra
# manualmente: JPA nunca debe crear/alterar/borrar tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# JWT (RF15 - login). No hay integracion real con CiDi en este
# entregable: se simula localmente contra ciudadanos.cuil/clave
# (ver AuthService). La clave de firma debe tener al menos 32
# caracteres (HMAC-SHA256) y nunca debe hardcodearse en el repo.
# ---------------------------------------------------------
jwt.secret=${JWT_SECRET}
