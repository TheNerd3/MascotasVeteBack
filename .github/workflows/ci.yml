# Integración continua (CI) del backend.
# Cada vez que se hace push o se abre un pull request contra main,
# GitHub revisa automáticamente que el código:
#   1. respete las reglas de estilo (lint),
#   2. pase todos los tests,
#   3. compile y genere el archivo .war (build),
#   4. y lo analiza en SonarQube Cloud (bugs, vulnerabilidades, código duplicado, cobertura).
#      Este paso solo corre si está cargado el secreto SONAR_TOKEN en el repo.
# Si algún paso falla, aparece una cruz roja en GitHub y se puede ver el motivo.

name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historia completa: SonarQube la usa para saber qué código es nuevo
          fetch-depth: 0

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Lint (reglas de estilo con Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Tests
        run: ./mvnw -B test

      - name: Build (generar el .war)
        run: ./mvnw -B package -DskipTests

      - name: Análisis de calidad con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Guardar el .war generado
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: target/*.war
          retention-days: 7
