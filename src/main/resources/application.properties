spring.application.name=backendVeterinarias

# ---------------------------------------------------------
# Conexion a la base de datos MascotasCordoba (SQL Server).
# Nada de datos de conexion escritos en el codigo: todo sale de
# variables de entorno, para que el mismo WAR funcione tanto desde
# el IDE como desde Docker sin tener que recompilar nada.
# ---------------------------------------------------------
# Direccion del servidor SQL Server y su base. Si no se define
# DB_HOST/DB_PORT/DB_NAME, se usan estos valores por defecto, que
# sirven para correr el backend directo desde el IDE contra el SQL
# Server instalado en la misma PC. "encrypt=false" evita que el driver
# exija un certificado SSL, que no hace falta para uso local.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:MascotasCordoba};encrypt=false
# Usuario de SQL Server. Por defecto "sa" (el usuario administrador
# que trae SQL Server), pero se puede cambiar por variable de entorno.
spring.datasource.username=${DB_USER:sa}
# Contrasenia de SQL Server. A proposito NO tiene un valor por
# defecto: si no se define DB_PASSWORD, el backend no arranca en vez
# de usar una contrasenia adivinada o vacia.
spring.datasource.password=${DB_PASSWORD}
# Driver JDBC que sabe hablar con SQL Server.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# El esquema ya existe (creado por el script SQL) y se administra
# manualmente: JPA nunca debe crear/alterar/borrar tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# JWT (RF15 - login). No hay integracion real con CiDi en este
# entregable: se simula localmente contra ciudadanos.cuil/clave
# (ver AuthService). La clave de firma debe tener al menos 32
# caracteres (HMAC-SHA256) y nunca debe hardcodearse en el repo.
# ---------------------------------------------------------
# Clave secreta con la que se firma el token de sesion.
jwt.secret=${JWT_SECRET}
# Cuanto tiempo (en segundos) dura valido el token antes de vencer.
# Por defecto 28800 segundos = 8 horas.
jwt.expiracion-segundos=${JWT_EXPIRACION:28800}

# ---------------------------------------------------------
# CORS: el frontend Angular corre en otro origen (otro puerto) que
# este backend, asi que el navegador bloquea los pedidos salvo que el
# backend le confirme explicitamente que ese origen esta permitido.
# ---------------------------------------------------------
# Origen (protocolo + dominio + puerto) desde el que se puede llamar a
# este backend. Por defecto el servidor de desarrollo de Angular.
cors.origen-permitido=${CORS_ORIGEN_PERMITIDO:http://localhost:4200}

# ---------------------------------------------------------
# Carnet sanitario digital (RF10/RF11). El token de verificacion es un
# hash HMAC-SHA256, distinto y separado del JWT de sesion.
# ---------------------------------------------------------
# Clave secreta con la que se firma el token del carnet.
carnet.token-secret=${CARNET_TOKEN_SECRET}
# Cuantos dias despues de emitido sigue siendo valido el token.
carnet.vigencia-dias=${CARNET_VIGENCIA_DIAS:365}
